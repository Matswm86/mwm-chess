name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default 'tools platform-tools' fails: Google removed the legacy 'tools' package.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mwm-chess-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Update the rolling "latest" release (main pushes)
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mwm-chess.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mwm-chess.apk --target "${GITHUB_SHA}" --latest --title "Latest build (rolling)" \
            --notes "Debug APK built from main at ${GITHUB_SHA}. Sideload: download mwm-chess.apk, open it, allow installs from this source."
        env:
          GH_TOKEN: ${{ github.token }}
